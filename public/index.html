<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAIT STUDIO — NIU LAI</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #101014;
    --panel2: #16161c;
    --border: #26262c;
    --lime: #c6ff00;
    --red: #ff3b3b;
    --text: #e8e8ea;
    --dim: #8a8a92;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; letter-spacing: 2px; }
  header h1 span { color: var(--lime); }
  #comboBadge { font-size: 13px; letter-spacing: 1px; }
  #comboBadge b.ok { color: var(--lime); }
  #comboBadge b.bad { color: var(--red); }

  main {
    display: grid;
    grid-template-columns: 1fr 440px;
    gap: 16px;
    padding: 16px 20px;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .panel-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 11px;
    display: flex; justify-content: space-between;
  }
  .panel-body { padding: 12px; }

  .trait-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 8px;
  }
  .trait {
    background: var(--panel2);
    border: 1px solid var(--border);
    cursor: pointer;
    padding: 6px;
    text-align: center;
  }
  .trait:hover { border-color: var(--dim); }
  .trait.selected { border-color: var(--lime); box-shadow: inset 0 0 0 1px var(--lime); }
  .trait img {
    width: 100%; aspect-ratio: 1/1; object-fit: contain; display: block;
    image-rendering: pixelated;
    background:
      conic-gradient(#1c1c22 0 25%, #121216 0 50%, #1c1c22 0 75%, #121216 0) 0 0 / 16px 16px;
  }
  .trait .tname { margin-top: 5px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trait .tweight { color: var(--dim); font-size: 10px; }
  .trait.selected .tname { color: var(--lime); }

  .group-head {
    color: var(--lime);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 10px 0 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .group-head:first-child { margin-top: 0; }
  .empty-hint { color: var(--dim); padding: 8px 0; line-height: 1.6; }
  .empty-hint code { color: var(--lime); }

  /* right column */
  #right { position: sticky; top: 16px; align-self: start; }
  #previewWrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background:
      conic-gradient(#1c1c22 0 25%, #121216 0 50%, #1c1c22 0 75%, #121216 0) 0 0 / 24px 24px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  #previewWrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated;
  }
  /* adjust mode: drag/scroll accessory placement */
  .adj-part {
    position: absolute;
    cursor: move;
    outline: 1px dashed rgba(198, 255, 0, 0.5);
  }
  .adj-part.active { outline: 2px solid var(--lime); }
  #adjBar { display: none; border-bottom: 1px solid var(--lime); background: var(--panel2); padding: 10px 12px; }
  #adjBar.on { display: block; }
  #adjBar .adj-title { color: var(--lime); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  #adjBar .adj-help { color: var(--dim); font-size: 10px; margin: 4px 0 8px; }
  #adjBar .adj-actions { display: flex; gap: 6px; margin-top: 10px; }
  #adjBar button { flex: 0 0 auto; padding: 7px 12px; border-top: 1px solid var(--border); font-size: 11px; }
  #adjBar button.save { background: var(--lime); color: #0a0a0c; font-weight: bold; border-color: var(--lime); }
  #adjBar button.part-btn.active { color: var(--lime); border-color: var(--lime); }
  .adj-slider {
    display: grid; grid-template-columns: 44px 1fr 52px; gap: 8px;
    align-items: center; margin: 6px 0;
  }
  .adj-slider .sl-label { color: var(--dim); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .adj-slider .sl-val { color: var(--lime); font-size: 11px; text-align: right; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; background: var(--border); outline: none; padding: 0; border: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; background: var(--lime); cursor: pointer; border: none;
  }

  /* builder: one scroll/arrow row per layer */
  #builder { border-bottom: 1px solid var(--border); }
  .b-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--panel2);
    user-select: none;
  }
  .b-row:last-child { border-bottom: none; }
  .b-row:hover { background: var(--panel2); }
  .b-btn {
    flex: 0 0 30px; width: 30px; padding: 8px 0;
    border: 1px solid var(--border); border-top: 1px solid var(--border);
    font-size: 11px; line-height: 1;
  }
  .b-thumb {
    flex: 0 0 40px; width: 40px; height: 40px; object-fit: contain;
    image-rendering: pixelated;
    background: conic-gradient(#1c1c22 0 25%, #121216 0 50%, #1c1c22 0 75%, #121216 0) 0 0 / 10px 10px;
    border: 1px solid var(--border);
  }
  .b-info { flex: 1; min-width: 0; }
  .b-layer { color: var(--dim); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .b-trait { color: var(--lime); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b-trait .b-group { color: var(--text); }
  .b-count { flex: 0 0 auto; color: var(--dim); font-size: 10px; }
  #comboList { padding: 10px 12px; border-bottom: 1px solid var(--border); line-height: 1.8; }
  #comboList .k { color: var(--dim); text-transform: uppercase; font-size: 11px; }
  #comboList .v { color: var(--lime); }

  .btn-row { display: flex; }
  button {
    flex: 1;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-top: none;
    padding: 11px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover { color: var(--lime); border-color: var(--dim); }
  button.primary { background: var(--lime); color: #0a0a0c; font-weight: bold; border-color: var(--lime); }
  button.primary:hover { background: #d8ff3d; color: #0a0a0c; }
  button:disabled { opacity: 0.4; cursor: default; }

  #mathBody { line-height: 1.9; }
  #mathBody .formula { font-size: 15px; }
  #mathBody .formula b { color: var(--lime); }
  .verdict-ok { color: var(--lime); }
  .verdict-bad { color: var(--red); }

  label { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 3px; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--lime); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .tpl-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .tpl-row:last-of-type { border-bottom: none; }
  .tpl-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text); }
  .tpl-copy {
    flex: 0 0 auto; width: 84px;
    border: 1px solid var(--border); border-top: 1px solid var(--border);
    padding: 6px 0;
  }
  #genBar { height: 4px; background: var(--panel2); margin-top: 12px; display: none; }
  #genBarFill { height: 100%; width: 0%; background: var(--lime); }
  #genStatus { margin-top: 8px; color: var(--dim); min-height: 18px; word-break: break-all; }
  #genStatus.err { color: var(--red); }
  #genStatus.ok { color: var(--lime); }
</style>
</head>
<body>
<header>
  <h1>TRAIT STUDIO <span>//</span> NIU LAI</h1>
  <div id="comboBadge">—</div>
</header>

<main>
  <section id="layersCol"></section>

  <section id="right">
    <div class="panel">
      <div class="panel-head"><span>Preview</span><span id="previewDims"></span></div>
      <div id="previewWrap"></div>
      <div id="adjBar"></div>
      <div id="builder"></div>
      <div id="comboList"></div>
      <div class="btn-row">
        <button id="btnRandom">Randomize</button>
        <button id="btnRescan">Rescan layers</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span>Combo math</span></div>
      <div class="panel-body" id="mathBody">—</div>
    </div>

    <div class="panel">
      <div class="panel-head"><span>Generate collection</span></div>
      <div class="panel-body">
        <div class="two-col">
          <div><label>Supply</label><input id="inCount" type="number" value="888"></div>
          <div><label>Collection name</label><input id="inName" value="Niu Lai"></div>
        </div>
        <label>Description</label>
        <textarea id="inDesc" rows="2"></textarea>
        <label>Base URI (image prefix in metadata)</label>
        <input id="inBase" value="ipfs://REPLACE_WITH_CID">
        <div class="two-col">
          <div><label>Width (blank = source size)</label><input id="inW" type="number" placeholder="auto"></div>
          <div><label>Height (blank = source size)</label><input id="inH" type="number" placeholder="auto"></div>
        </div>
        <div style="margin-top:14px" class="btn-row">
          <button id="btnGen" class="primary" style="border-top:1px solid var(--lime)">Generate</button>
        </div>
        <div id="genBar"><div id="genBarFill"></div></div>
        <div id="genStatus"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span>Prompt templates — copy &amp; paste into ChatGPT</span></div>
      <div class="panel-body" id="tplBody"></div>
    </div>
  </section>
</main>

<script>
let layers = [];
let validCombos = 0;
let sel = []; // selected trait index per layer
let placements = {}; // movable accessory placements, keyed by "05-hat/bull/black cap.png"
let adj = null; // active adjust session: { key, src, parts, active, li }

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('en-US');

async function loadLayers() {
  const r = await fetch('/api/layers');
  const data = await r.json();
  placements = await (await fetch('/api/placements')).json();
  layers = data.layers;
  validCombos = data.validCombos;
  const bust = Date.now();
  layers.forEach((l) => l.traits.forEach((t) => { t.url += '?t=' + bust; })); // rescan shows fresh art
  sel = layers.map(() => 0);
  alignGroups(null);
  renderLayers();
  renderAll();
}

// grouped layers (bull/cow) must agree — switch other layers' selections to group g
function alignGroups(g) {
  if (g === null) {
    const first = layers.flatMap((l, li) => (l.traits[sel[li]] ? [l.traits[sel[li]].group] : [])).find(Boolean);
    if (!first) return;
    g = first;
  }
  layers.forEach((l, li) => {
    const cur = l.traits[sel[li]];
    if (!cur || !cur.group || cur.group === g) return;
    // same trait exists for the new species (e.g. bull cap → cow cap)? follow it
    const same = l.traits.findIndex((t) => t.group === g && t.name === cur.name);
    const ti = same >= 0 ? same : l.traits.findIndex((t) => t.group === g || !t.group);
    if (ti >= 0) sel[li] = ti;
  });
}

function renderLayers() {
  const col = $('layersCol');
  col.innerHTML = '';
  if (!layers.length) {
    col.innerHTML = '<div class="panel"><div class="panel-body empty-hint">No layer folders found.<br>' +
      'Create folders inside <code>layers/</code> like <code>01-background</code>, <code>02-color</code>, <code>03-body</code> and drop PNGs in them.<br>' +
      'Folder number prefix = stacking order (01 is the bottom).</div></div>';
    return;
  }
  layers.forEach((layer, li) => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    const head = document.createElement('div');
    head.className = 'panel-head';
    head.innerHTML = '<span>' + layer.dir + '</span><span>' + layer.traits.length + ' traits</span>';
    panel.appendChild(head);
    const body = document.createElement('div');
    body.className = 'panel-body';
    if (!layer.traits.length) {
      body.innerHTML = '<div class="empty-hint">Empty — drop PNGs into <code>layers/' + layer.dir + '/</code></div>';
    } else {
      // one section per group (bull / cow), plus one for ungrouped traits
      const sections = [];
      if (layer.traits.some((t) => !t.group)) sections.push(null);
      (layer.groups || []).forEach((g) => sections.push(g));
      sections.forEach((g) => {
        const traits = layer.traits.map((t, ti) => ({ t, ti })).filter((x) => x.t.group === g);
        if (!traits.length) return;
        if (g !== null || sections.length > 1) {
          const gh = document.createElement('div');
          gh.className = 'group-head';
          gh.textContent = (g === null ? 'shared' : g) + ' — ' + traits.length;
          body.appendChild(gh);
        }
        const grid = document.createElement('div');
        grid.className = 'trait-grid';
        traits.forEach(({ t, ti }) => {
          const card = document.createElement('div');
          card.className = 'trait' + (sel[li] === ti ? ' selected' : '');
          card.innerHTML = '<img src="' + t.url + '" loading="lazy">' +
            '<div class="tname">' + t.name + '</div>' +
            '<div class="tweight">w:' + t.weight + '</div>';
          card.onclick = () => {
            sel[li] = ti;
            if (t.group) alignGroups(t.group);
            renderLayers(); renderAll();
          };
          grid.appendChild(card);
        });
        body.appendChild(grid);
      });
    }
    panel.appendChild(body);
    col.appendChild(panel);
  });
}

function renderAll() {
  if (adj && placementKey(adj.li) !== adj.key) adj = null; // selection moved off the adjusted trait
  renderPreview();
  renderAdjBar();
  renderBuilder();
  renderComboList();
  renderMath();
}

function cycle(li, dir) {
  const n = layers[li].traits.length;
  if (!n) return;
  sel[li] = (sel[li] + dir + n) % n;
  const t = layers[li].traits[sel[li]];
  if (t.group) alignGroups(t.group);
  renderLayers();
  renderAll();
}

function renderBuilder() {
  const el = $('builder');
  el.innerHTML = '';
  layers.forEach((layer, li) => {
    if (!layer.traits.length) return;
    const t = layer.traits[sel[li]];
    const row = document.createElement('div');
    row.className = 'b-row';

    const prev = document.createElement('button');
    prev.className = 'b-btn';
    prev.textContent = '◀';
    prev.onclick = () => cycle(li, -1);

    const thumb = document.createElement('img');
    thumb.className = 'b-thumb';
    thumb.src = t.url;

    const info = document.createElement('div');
    info.className = 'b-info';
    info.innerHTML = '<div class="b-layer">' + layer.label + '</div>' +
      '<div class="b-trait">' + (t.group ? '<span class="b-group">' + t.group + ' / </span>' : '') + t.name + '</div>';

    const count = document.createElement('div');
    count.className = 'b-count';
    count.textContent = (sel[li] + 1) + '/' + layer.traits.length;

    const next = document.createElement('button');
    next.className = 'b-btn';
    next.textContent = '▶';
    next.onclick = () => cycle(li, 1);

    row.append(prev, thumb, info, count, next);
    if (placements[layer.dir + '/' + t.rel]) {
      const mv = document.createElement('button');
      mv.className = 'b-btn';
      mv.title = 'move / resize this trait';
      mv.textContent = '✥';
      mv.onclick = () => enterAdjust(li);
      row.append(mv);
    }
    row.addEventListener('wheel', (e) => {
      e.preventDefault();
      cycle(li, e.deltaY > 0 ? 1 : -1);
    }, { passive: false });
    el.appendChild(row);
  });
}

function renderPreview() {
  const wrap = $('previewWrap');
  wrap.innerHTML = '';
  layers.forEach((layer, li) => {
    const t = layer.traits[sel[li]];
    if (!t) return;
    if (adj && adj.li === li) return; // adjusted layer drawn as live parts below
    const img = document.createElement('img');
    const key = layers[li].dir + '/' + t.rel;
    const ov = skinOverrideParts(key);
    img.src = ov ? variantUrl(key, currentBodySkin()) : t.url;
    if (li === 0) {
      img.onload = () => {
        if (img.naturalWidth && img.naturalHeight) {
          wrap.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
          $('previewDims').textContent = img.naturalWidth + '×' + img.naturalHeight;
        }
      };
    }
    wrap.appendChild(img);
  });
  if (adj) renderAdjParts();
}

// ---- adjust mode: move/resize accessory parts ----
const CANVAS = 1254;

function placementKey(li) {
  const t = layers[li].traits[sel[li]];
  return t ? layers[li].dir + '/' + t.rel : null;
}

function currentBodySkin() {
  const li = layers.findIndex((l) => l.dir === '02-body');
  if (li < 0) return null;
  const t = layers[li].traits[sel[li]];
  return t ? t.name : null;
}

function variantUrl(key, skin) {
  const parts = key.replace(/\.png$/i, '').split('/');
  parts[parts.length - 1] += '@' + skin + '.png';
  return '/variants/' + parts.map(encodeURIComponent).join('/') + '?t=' + Date.now();
}

function skinOverrideParts(key) {
  const skin = currentBodySkin();
  const p = placements[key];
  return skin && p && p.overrides && p.overrides[skin] ? p.overrides[skin] : null;
}

function enterAdjust(li) {
  const key = placementKey(li);
  const p = placements[key];
  if (!p) return;
  const startParts = skinOverrideParts(key) || p.parts;
  adj = { key, src: p.src, parts: JSON.parse(JSON.stringify(startParts)), active: 0, li, skin: currentBodySkin() };
  renderAll();
}

function exitAdjust() { adj = null; renderAll(); }

function renderAdjParts() {
  const wrap = $('previewWrap');
  adj.parts.forEach((p, i) => {
    const img = document.createElement('img');
    img.className = 'adj-part' + (i === adj.active ? ' active' : '');
    img.src = '/' + adj.src;
    img.draggable = false;
    img.style.left = (p.left / CANVAS * 100) + '%';
    img.style.top = (p.top / CANVAS * 100) + '%';
    img.style.width = (p.width / CANVAS * 100) + '%';
    img.style.height = p.height ? (p.height / CANVAS * 100) + '%' : 'auto';
    img.style.objectFit = 'fill';
    img.style.transform = (p.fliph ? 'scaleX(-1)' : '') + (p.flipv ? ' scaleY(-1)' : '');
    img.onmousedown = (e) => {
      e.preventDefault();
      adj.active = i;
      const f = wrap.clientWidth / CANVAS;
      const startX = e.clientX, startY = e.clientY, startL = p.left, startT = p.top;
      const move = (ev) => {
        p.left = Math.round(startL + (ev.clientX - startX) / f);
        p.top = Math.round(startT + (ev.clientY - startY) / f);
        syncAdjSliders();
        renderPreview();
      };
      const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      renderPreview();
    };
    wrap.appendChild(img);
  });
}

function adjScale(factor) {
  const p = adj.parts[adj.active];
  const img = document.querySelectorAll('.adj-part')[adj.active];
  const aspect = p.height ? p.height / p.width : (img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1);
  const w2 = Math.max(10, Math.round(p.width * factor));
  const h1 = p.height || Math.round(p.width * aspect);
  const h2 = Math.round(w2 * aspect);
  p.left = Math.round(p.left - (w2 - p.width) / 2);
  p.top = Math.round(p.top - (h2 - h1) / 2);
  p.width = w2;
  if (p.height) p.height = h2;
  syncAdjSliders();
  renderPreview();
}

$('previewWrap').addEventListener('wheel', (e) => {
  if (!adj) return;
  e.preventDefault();
  adjScale(e.deltaY > 0 ? 1 / 1.04 : 1.04);
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (!adj) return;
  const step = e.shiftKey ? 10 : 2;
  const p = adj.parts[adj.active];
  if (e.key === 'ArrowLeft') { p.left -= step; }
  else if (e.key === 'ArrowRight') { p.left += step; }
  else if (e.key === 'ArrowUp') { p.top -= step; }
  else if (e.key === 'ArrowDown') { p.top += step; }
  else if (e.key === 'Escape') { exitAdjust(); return; }
  else return;
  e.preventDefault();
  syncAdjSliders();
  renderPreview();
});

let adjSliders = null; // { x, y, size, labels: {x,y,size} } for live sync while dragging

function adjSliderRow(label, min, max, value, oninput) {
  const row = document.createElement('div');
  row.className = 'adj-slider';
  const lab = document.createElement('span');
  lab.className = 'sl-label';
  lab.textContent = label;
  const range = document.createElement('input');
  range.type = 'range';
  range.min = min; range.max = max; range.value = value;
  const val = document.createElement('span');
  val.className = 'sl-val';
  val.textContent = value;
  range.oninput = () => { val.textContent = range.value; oninput(parseInt(range.value, 10)); };
  row.append(lab, range, val);
  return { row, range, val };
}

function syncAdjSliders() {
  if (!adj || !adjSliders) return;
  const p = adj.parts[adj.active];
  adjSliders.x.range.value = p.left; adjSliders.x.val.textContent = p.left;
  adjSliders.y.range.value = p.top; adjSliders.y.val.textContent = p.top;
  adjSliders.size.range.value = p.width; adjSliders.size.val.textContent = p.width;
}

function renderAdjBar() {
  const bar = $('adjBar');
  if (!adj) { bar.className = ''; bar.innerHTML = ''; adjSliders = null; return; }
  bar.className = 'on';
  const t = layers[adj.li].traits[sel[adj.li]];
  bar.innerHTML = '<div class="adj-title">ADJUSTING: ' + layers[adj.li].label + ' / ' + t.name +
    (t.group ? ' (' + t.group + ')' : '') + '</div>' +
    '<div class="adj-help">sliders or drag on image &middot; scroll on image = resize &middot; arrows nudge &middot; esc cancel' +
    (adj.key.startsWith('05-cig/') ? ' &middot; <span style="color:var(--lime)">cig &amp; joint share this position</span>' : '') +
    '</div>';

  if (adj.parts.length > 1) {
    const tabs = document.createElement('div');
    tabs.className = 'adj-actions';
    tabs.style.marginTop = '0';
    adj.parts.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'part-btn' + (i === adj.active ? ' active' : '');
      b.textContent = i === 0 ? 'RIGHT EAR' : 'LEFT EAR';
      if (adj.parts.length > 2) b.textContent = 'PART ' + (i + 1);
      b.onclick = () => { adj.active = i; renderPreview(); renderAdjBar(); };
      tabs.appendChild(b);
    });
    bar.appendChild(tabs);
  }

  const p = adj.parts[adj.active];
  const x = adjSliderRow('X', -300, 1300, p.left, (v) => { p.left = v; renderPreview(); });
  const y = adjSliderRow('Y', -300, 1300, p.top, (v) => { p.top = v; renderPreview(); });
  const size = adjSliderRow('SIZE', 20, 1300, p.width, (v) => {
    // resize around the part's center, like the scroll wheel does
    const img = document.querySelectorAll('.adj-part')[adj.active];
    const aspect = p.height ? p.height / p.width : (img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1);
    const h1 = p.height || Math.round(p.width * aspect);
    const h2 = Math.round(v * aspect);
    p.left = Math.round(p.left - (v - p.width) / 2);
    p.top = Math.round(p.top - (h2 - h1) / 2);
    p.width = v;
    if (p.height) p.height = h2;
    syncAdjSliders();
    renderPreview();
  });
  bar.append(x.row, y.row, size.row);
  adjSliders = { x, y, size };

  async function post(body, btn) {
    btn.textContent = 'SAVING…';
    const r = await fetch('/api/place', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (r.ok) { adj = null; await loadLayers(); }
    else { btn.textContent = 'ERROR'; }
  }

  const species = t.group || '';
  const hasOverride = !!skinOverrideParts(adj.key);
  const info = document.createElement('div');
  info.className = 'adj-help';
  info.textContent = 'body: ' + (adj.skin || '?') +
    (hasOverride ? ' — this skin has its OWN saved position' : ' — using the default ' + species + ' position');
  bar.appendChild(info);

  const actions = document.createElement('div');
  actions.className = 'adj-actions';

  const saveSkin = document.createElement('button');
  saveSkin.className = 'save';
  saveSkin.textContent = 'SAVE: THIS SKIN';
  saveSkin.title = 'only ' + species + ' / ' + (adj.skin || '');
  saveSkin.onclick = () => post({ key: adj.key, src: adj.src, parts: adj.parts, skin: adj.skin }, saveSkin);

  const saveAll = document.createElement('button');
  saveAll.className = 'save';
  saveAll.textContent = 'SAVE: ALL ' + species.toUpperCase() + 'S';
  saveAll.title = 'default position for every ' + species + ' skin (skin overrides stay)';
  saveAll.onclick = () => post({ key: adj.key, src: adj.src, parts: adj.parts }, saveAll);

  const cancel = document.createElement('button');
  cancel.textContent = 'CANCEL';
  cancel.onclick = exitAdjust;

  actions.append(saveSkin, saveAll, cancel);

  if (hasOverride) {
    const reset = document.createElement('button');
    reset.textContent = 'RESET SKIN';
    reset.title = 'remove this skin\'s override — falls back to the default position';
    reset.onclick = () => post({ key: adj.key, skin: adj.skin, remove: true }, reset);
    actions.append(reset);
  }
  bar.appendChild(actions);
}

function renderComboList() {
  const el = $('comboList');
  const species = layers.map((l, li) => (l.traits[sel[li]] || {}).group).find(Boolean);
  let html = species ? '<div><span class="k">species</span> — <span class="v">' + species + '</span></div>' : '';
  html += layers.map((layer, li) => {
    const t = layer.traits[sel[li]];
    return '<div><span class="k">' + layer.label + '</span> — <span class="v">' + (t ? t.name : '—') + '</span></div>';
  }).join('');
  el.innerHTML = html || '<span class="empty-hint">no layers</span>';
}

function layerTerm(l) {
  if (!l.traits.some((t) => t.group)) return String(l.traits.length);
  const parts = [];
  const ungrouped = l.traits.filter((t) => !t.group).length;
  if (ungrouped) parts.push(ungrouped);
  (l.groups || []).forEach((g) => {
    const n = l.traits.filter((t) => t.group === g).length;
    if (n) parts.push(n + ' ' + g);
  });
  return '(' + parts.join(' + ') + ')';
}

function renderMath() {
  const target = parseInt($('inCount').value, 10) || 1111;
  const withTraits = layers.filter((l) => l.traits.length > 0);
  const total = validCombos;
  const badge = $('comboBadge');
  const ok = total >= target;
  badge.innerHTML = '<b class="' + (ok ? 'ok' : 'bad') + '">' + fmt(total) + '</b> / ' + fmt(target) + ' combos';

  const el = $('mathBody');
  if (!withTraits.length) { el.textContent = 'Add trait images first.'; return; }
  const nums = withTraits.map(layerTerm).join(' × ');
  const formula = withTraits.map((l) => l.traits.length + ' ' + l.label).join(' × ');
  let html = '<div class="formula">' + nums + ' = <b>' + fmt(total) + '</b> unique combos</div>';
  html += '<div style="color:var(--dim)">' + formula + ' (bull/cow never mix)</div>';
  if (ok) {
    html += '<div class="verdict-ok">ENOUGH for ' + fmt(target) + ' — ' + fmt(total - target) + ' spare</div>';
  } else {
    html += '<div class="verdict-bad">SHORT BY ' + fmt(target - total) + ' — add more traits or layers</div>';
  }
  el.innerHTML = html;
}

function weightedRandom(traits) {
  const total = traits.reduce((a, t) => a + t.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < traits.length; i++) { r -= traits[i].weight; if (r <= 0) return i; }
  return traits.length - 1;
}

$('btnRandom').onclick = () => {
  const G = [...new Set(layers.flatMap((l) => l.traits.filter((t) => t.group).map((t) => t.group)))];
  const g = G.length ? G[Math.floor(Math.random() * G.length)] : null;
  sel = layers.map((l) => {
    if (!l.traits.length) return 0;
    const pool = l.traits.some((t) => t.group)
      ? l.traits.map((t, ti) => ({ t, ti })).filter((x) => !x.t.group || x.t.group === g)
      : l.traits.map((t, ti) => ({ t, ti }));
    if (!pool.length) return 0;
    return pool[weightedRandom(pool.map((x) => x.t))].ti;
  });
  renderLayers();
  renderAll();
};
$('btnRescan').onclick = loadLayers;
$('inCount').oninput = renderMath;

// ---- generation ----
let polling = null;

$('btnGen').onclick = async () => {
  const status = $('genStatus');
  status.className = '';
  status.textContent = 'starting…';
  const body = {
    count: parseInt($('inCount').value, 10) || 1111,
    name: $('inName').value,
    description: $('inDesc').value,
    baseUri: $('inBase').value,
    width: parseInt($('inW').value, 10) || 0,
    height: parseInt($('inH').value, 10) || 0,
  };
  const r = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) { status.className = 'err'; status.textContent = 'ERROR: ' + data.error; return; }
  $('btnGen').disabled = true;
  $('genBar').style.display = 'block';
  polling = setInterval(poll, 400);
};

async function poll() {
  const r = await fetch('/api/progress');
  const j = await r.json();
  const status = $('genStatus');
  if (j.error) {
    clearInterval(polling);
    $('btnGen').disabled = false;
    status.className = 'err';
    status.textContent = 'ERROR: ' + j.error;
    return;
  }
  const pct = j.total ? Math.round((j.done / j.total) * 100) : 0;
  $('genBarFill').style.width = pct + '%';
  if (j.running) {
    status.className = '';
    status.textContent = 'generating ' + fmt(j.done) + ' / ' + fmt(j.total) + ' (' + pct + '%)';
  } else if (j.done > 0 && j.done === j.total) {
    clearInterval(polling);
    $('btnGen').disabled = false;
    status.className = 'ok';
    status.textContent = 'DONE — ' + fmt(j.total) + ' images + metadata in ' + j.outDir + ' (' + Math.round(j.ms / 1000) + 's)';
  }
}

  'No text, no watermark, no shadow on the ground.';

      RULES,
  },
];

function renderTemplates() {
  const el = $('tplBody');
  el.innerHTML = '';
  TEMPLATES.forEach((tpl, i) => {
    const row = document.createElement('div');
    row.className = 'tpl-row';
    row.innerHTML = '<span class="tpl-label">' + tpl.label + '</span>';
    const btn = document.createElement('button');
    btn.className = 'tpl-copy';
    btn.textContent = 'COPY';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(tpl.text); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = tpl.text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      btn.textContent = 'COPIED';
      setTimeout(() => { btn.textContent = 'COPY'; }, 1500);
    };
    row.appendChild(btn);
    el.appendChild(row);
  });
  // copy every trait's saved position (per species) as JSON — paste this to Claude
  const posRow = document.createElement('div');
  posRow.className = 'tpl-row';
  posRow.innerHTML = '<span class="tpl-label">Trait positions (paste to Claude)</span>';
  const posBtn = document.createElement('button');
  posBtn.className = 'tpl-copy';
  posBtn.textContent = 'COPY';
  posBtn.onclick = async () => {
    const text = 'NIU LAI trait placements (canvas 1254x1254, left/top/width px):\n' +
      JSON.stringify(placements, null, 2);
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    posBtn.textContent = 'COPIED';
    setTimeout(() => { posBtn.textContent = 'COPY'; }, 1500);
  };
  posRow.appendChild(posBtn);
  el.appendChild(posRow);

  const hint = document.createElement('div');
  hint.className = 'empty-hint';
  hint.innerHTML = 'Fill the [BRACKETS], attach the base character image, and generate. ' +
    'Then save the result to Downloads and tell Claude the filename + which layer it goes in.';
  el.appendChild(hint);
}
renderTemplates();

loadLayers();
